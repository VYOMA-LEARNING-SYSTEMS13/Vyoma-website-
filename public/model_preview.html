<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vyoma 3D Model Inspector</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(226, 232, 240, 0.8);
      max-width: 420px;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 1.1rem;
      color: #4f46e5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.9rem;
      background: #fff;
      cursor: pointer;
      margin-bottom: 12px;
      outline: none;
    }
    select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    #info {
      font-size: 0.82rem;
      line-height: 1.5;
      color: #334155;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: #e0e7ff;
      color: #4338ca;
      font-weight: 600;
      font-size: 0.75rem;
      margin-bottom: 6px;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <h2>Vyoma Model Inspector</h2>
    <label for="modelSelect" style="font-size: 0.8rem; font-weight: 600; color: #64748b; margin-bottom: 4px; display: block;">Select GLB to Inspect:</label>
    <select id="modelSelect">
      <option value="/3d_models/solar_system_animation.glb">1. Solar System (10.14 MB)</option>
      <option value="/3d_models/earth.glb">2. Earth Globe (7.69 MB)</option>
      <option value="/3d_models/dna_smoother_mesh.glb">3. DNA Smoother Mesh (16.29 MB)</option>
      <option value="/3d_models/dna_-_protein_complex_leucine_zipper.glb">4. DNA Protein Leucine Zipper (2.20 MB)</option>
      <option value="/3d_models/animated_atom_blender_cycles.glb">5. Animated Atom (13.13 MB)</option>
      <option value="/3d_models/cytosine_molecule__dnarna_base_3d_model.glb">6. Cytosine Molecule (1.32 MB)</option>
      <option value="/3d_models/diamond_molecule_structure.glb">7. Diamond Structure (5.70 MB)</option>
      <option value="/3d_models/chemistry_glassware.glb">8. Chemistry Glassware (0.21 MB)</option>
      <option value="/3d_models/free_conical_flask__laboratory__low_poly.glb">9. Conical Flask Laboratory (0.13 MB)</option>
      <option value="/3d_models/trigonometry.glb">10. Trigonometry Unit Circle (1.75 MB)</option>
      <option value="/3d_models/visualizing_trigonometry_cosine_function.glb">11. Trigonometry Cosine Wave (3.36 MB)</option>
      <option value="/3d_models/math.glb">12. Math Symbols (0.24 MB)</option>
      <option value="/brain.glb">13. Brain (2.45 MB)</option>
    </select>
    <div id="info">Loading model...</div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const infoEl = document.getElementById('info');
    const selectEl = document.getElementById('modelSelect');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf1f5f9);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 3, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight2.position.set(-6, -2, -4);
    scene.add(dirLight2);

    const grid = new THREE.GridHelper(10, 20, 0xc7d2fe, 0xe2e8f0);
    grid.position.y = -1.5;
    scene.add(grid);

    const loader = new GLTFLoader();
    let currentModel = null;
    let mixer = null;
    const clock = new THREE.Clock();

    function loadModel(url) {
      if (currentModel) {
        scene.remove(currentModel);
        currentModel = null;
      }
      if (mixer) {
        mixer.stopAllAction();
        mixer = null;
      }
      infoEl.innerHTML = `<span class="badge">Loading...</span><br>Fetching ${url}...`;

      loader.load(
        url,
        (gltf) => {
          currentModel = gltf.scene;

          // Center and normalize scale
          const box = new THREE.Box3().setFromObject(currentModel);
          const size = new THREE.Vector3();
          box.getSize(size);
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = maxDim > 0 ? 3 / maxDim : 1;
          currentModel.scale.setScalar(scale);

          box.setFromObject(currentModel);
          const center = new THREE.Vector3();
          box.getCenter(center);
          currentModel.position.sub(center);

          scene.add(currentModel);

          // Handle animations
          let animInfo = "None";
          if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(currentModel);
            gltf.animations.forEach((clip) => {
              mixer.clipAction(clip).play();
            });
            animInfo = `${gltf.animations.length} clip(s): ` + gltf.animations.map(a => a.name || 'unnamed').join(', ');
          }

          controls.reset();
          camera.position.set(0, 1.5, 4.5);
          controls.target.set(0, 0, 0);

          infoEl.innerHTML = `
            <span class="badge" style="background:#dcfce7; color:#15803d;">Loaded Successfully</span><br>
            <strong>Dimensions:</strong> ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}<br>
            <strong>Applied Scale:</strong> ${scale.toFixed(4)}<br>
            <strong>Animations:</strong> ${animInfo}
          `;
        },
        undefined,
        (err) => {
          console.error(err);
          infoEl.innerHTML = `<span class="badge" style="background:#fee2e2; color:#b91c1c;">Load Error</span><br>${err.message || String(err)}`;
        }
      );
    }

    selectEl.addEventListener('change', (e) => {
      loadModel(e.target.value);
    });

    // Initial load
    loadModel(selectEl.value);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
