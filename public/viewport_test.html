<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vyoma Hero Viewport Test Harness</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    #toolbar {
      width: 100%;
      background: #1e293b;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
      border-bottom: 1px solid #334155;
      z-index: 999;
      flex-wrap: wrap;
    }
    select, button {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    #info {
      font-size: 13px;
      color: #94a3b8;
    }
    #viewport-wrapper {
      margin: 20px auto;
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #6366f1;
      display: flex;
      flex-direction: column;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <strong>Viewport Test:</strong>
    <select id="presetSelect">
      <option value="320,658">320px × 658px (Smallest Mobile / Fold Outer)</option>
      <option value="360,800">360px × 800px (Android Standard)</option>
      <option value="375,667">375px × 667px (iPhone SE)</option>
      <option value="390,844" selected>390px × 844px (iPhone 12/13/14)</option>
      <option value="414,896">414px × 896px (iPhone XR / 11)</option>
      <option value="430,932">430px × 932px (iPhone 14/15 Pro Max)</option>
      <option value="768,1024">768px × 1024px (iPad Portrait)</option>
      <option value="1024,768">1024px × 768px (iPad Landscape)</option>
      <option value="1280,800">1280px × 800px (Desktop)</option>
      <option value="844,390">844px × 390px (Mobile Landscape)</option>
    </select>
    <button id="reloadBtn">Reload Frame</button>
    <span id="info"></span>
  </div>

  <div id="viewport-wrapper">
    <iframe id="testFrame" src="/"></iframe>
  </div>

  <script>
    const wrapper = document.getElementById('viewport-wrapper');
    const select = document.getElementById('presetSelect');
    const iframe = document.getElementById('testFrame');
    const info = document.getElementById('info');
    const reloadBtn = document.getElementById('reloadBtn');

    function updateSize(w, h) {
      wrapper.style.width = w + 'px';
      wrapper.style.height = h + 'px';
      checkFrame();
    }

    function checkFrame() {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const hero = doc.querySelector('.hero-section');
        const solar = doc.querySelector('.hero-obj-solar');
        const earth = doc.querySelector('.hero-obj-earth');
        if (hero) {
          const hRect = hero.getBoundingClientRect();
          const sRect = solar ? solar.getBoundingClientRect() : null;
          const eRect = earth ? earth.getBoundingClientRect() : null;
          info.innerHTML = `Frame: ${wrapper.style.width} × ${wrapper.style.height} | Hero H: ${Math.round(hRect.height)}px | Solar Top: ${sRect ? Math.round(sRect.top) : 'N/A'}px | Earth Top: ${eRect ? Math.round(eRect.top) : 'N/A'}px`;
        }
      } catch (e) {
        info.textContent = `Current: ${wrapper.style.width} × ${wrapper.style.height}`;
      }
    }

    // Read query params
    const params = new URLSearchParams(window.location.search);
    const qW = params.get('w');
    const qH = params.get('h');
    if (qW && qH) {
      updateSize(qW, qH);
      for (const opt of select.options) {
        if (opt.value === `${qW},${qH}`) {
          select.value = opt.value;
        }
      }
    } else {
      const [w, h] = select.value.split(',');
      updateSize(w, h);
    }

    select.addEventListener('change', () => {
      const [w, h] = select.value.split(',');
      updateSize(w, h);
    });

    reloadBtn.addEventListener('click', () => {
      iframe.src = iframe.src;
    });

    iframe.addEventListener('load', () => {
      setTimeout(checkFrame, 1500);
    });
  </script>
</body>
</html>
